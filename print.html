<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Coding 工程实践档案 - 证据链</title>
    <style>
        @page {
            size: A4;
            margin: 2cm;
        }

        body {
            font-family: "Microsoft YaHei", "SimSun", Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            font-size: 11pt;
            max-width: 100%;
        }

        .cover {
            text-align: center;
            padding: 100px 0;
            page-break-after: always;
        }

        .cover h1 {
            font-size: 2.5em;
            color: #667eea;
            margin-bottom: 20px;
        }

        .cover p {
            font-size: 1.2em;
            color: #666;
        }

        h1 {
            color: #667eea;
            page-break-before: always;
            margin-top: 0;
            font-size: 1.8em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        h1:first-of-type {
            page-break-before: avoid;
        }

        h2 {
            color: #764ba2;
            margin-top: 1.5em;
            font-size: 1.4em;
        }

        h3 {
            color: #555;
            margin-top: 1.2em;
            font-size: 1.2em;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 1em 0;
            font-size: 0.85em;
            page-break-inside: avoid;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f5f5f5;
            font-weight: bold;
        }

        code {
            background: #f4f4f4;
            padding: 2px 5px;
            border-radius: 3px;
            font-family: "Courier New", Consolas, monospace;
            font-size: 0.9em;
        }

        pre {
            background: #f4f4f4;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
            page-break-inside: avoid;
        }

        pre code {
            background: none;
            padding: 0;
        }

        ul, ol {
            margin: 0.5em 0;
            padding-left: 2em;
        }

        li {
            margin: 0.3em 0;
        }

        .highlight-box {
            background: #f9f9f9;
            padding: 15px;
            border-left: 4px solid #667eea;
            margin: 1em 0;
            page-break-inside: avoid;
        }

        strong {
            color: #333;
        }

        @media print {
            body {
                background: white;
            }

            a {
                color: #667eea;
                text-decoration: none;
            }
        }
    </style>
</head>
<body>
    <div class="cover">
        <h1>AI Coding 工程实践档案</h1>
        <p>证据链补充文档 · 脱敏版</p>
        <p style="margin-top: 50px; font-size: 1em; color: #999;">本文档展示实际工程实践中的量化数据、调试案例与协作流程</p>
    </div>

    <!-- 这里需要插入所有 markdown 转换后的 HTML 内容 -->
    <div id="content">
        <p style="color: #999; font-style: italic;">内容正在加载...</p>
    </div>

    <script>
        // 加载并渲染所有 markdown 文件
        const files = [
            { path: 'data/projects-metrics.md', title: '两个项目的工程指标' },
            { path: 'data/case-01-circuit-breaker.md', title: '案例1：TCP熔断器' },
            { path: 'data/case-02-heap-fragmentation.md', title: '案例2：堆碎片化' },
            { path: 'data/case-03-upload-atomicity.md', title: '案例3：上传非原子性' },
            { path: 'data/multi-agent-workflow.md', title: '人在环多Agent协同' },
            { path: 'data/external-audit-log.md', title: '外部复核记录' }
        ];

        async function loadAndRender() {
            const content = document.getElementById('content');
            content.innerHTML = '';

            for (const file of files) {
                try {
                    const response = await fetch(file.path);
                    const markdown = await response.text();

                    // 简单的 markdown 转换（仅处理基本格式）
                    let html = markdown
                        .replace(/^# (.+)$/gm, '<h1>$1</h1>')
                        .replace(/^## (.+)$/gm, '<h2>$1</h2>')
                        .replace(/^### (.+)$/gm, '<h3>$1</h3>')
                        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                        .replace(/`(.+?)`/g, '<code>$1</code>')
                        .replace(/^- (.+)$/gm, '<li>$1</li>')
                        .replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>')
                        .replace(/\n\n/g, '</p><p>')
                        .replace(/^(.+)$/gm, '<p>$1</p>');

                    content.innerHTML += html;
                } catch (error) {
                    content.innerHTML += `<p style="color: red;">加载 ${file.path} 失败: ${error.message}</p>`;
                }
            }
        }

        // 页面加载完成后执行
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', loadAndRender);
        } else {
            loadAndRender();
        }
    </script>
</body>
</html>
